<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMH Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0908;color:#f7f2ea;font-family:Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:22px}.top{border-bottom:1px solid #302821;background:#11100f;position:sticky;top:0;z-index:5}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand b{color:#f0a63a;font-size:24px;margin-right:8px}.brand small{display:block;color:#999;font-size:11px;margin-left:42px;margin-top:-4px}
.panel{background:#151210;border:1px solid #302821;border-radius:16px;padding:20px;margin-top:25px;box-shadow:0 15px 45px #0008}
.login{max-width:470px;margin:10vh auto}h1{font-size:34px;margin:0 0 8px}h2{margin:0 0 18px}.sub,.small{color:#9e958b}.small{font-size:12px;line-height:1.5}
label{display:block;font-size:13px;font-weight:bold;margin:14px 0 7px;color:#d4c9bc}
input,textarea,select{width:100%;padding:12px;background:#0d0c0b;color:#fff;border:1px solid #40352b;border-radius:10px}textarea{min-height:120px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:12px}}
.btn{padding:11px 15px;border-radius:10px;border:1px solid #40352b;background:#17130f;color:#fff;font-weight:bold;cursor:pointer}.gold{background:#f0a63a;color:#15100a;border-color:#f0a63a}.danger{color:#ffaaa7}
.msg{padding:11px;border:1px solid #40352b;border-radius:10px;margin-top:14px;color:#aaa}.ok{color:#70d69e;border-color:#28583f}.err{color:#ffaaa7;border-color:#63302d}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{max-width:330px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px;margin-top:18px}
.card{background:#100e0c;border:1px solid #302821;border-radius:14px;overflow:hidden}.poster{height:190px;position:relative;background:#201a15}.poster img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:10px;left:10px;background:#0a0909dd;border:1px solid #5b4735;padding:6px 9px;border-radius:20px;color:#ffc56b;font-size:11px;font-weight:bold}.body{padding:14px}.body h3{margin:0 0 8px}.meta{color:#999;font-size:13px;line-height:1.6}.actions{margin-top:13px}.hidden{display:none!important}.preview{width:150px;height:150px;object-fit:cover;border-radius:10px;margin-top:10px;border:1px solid #40352b}
</style></head><body>
<header class="top"><div class="wrap nav"><div class="brand"><b>BMH</b>Band Music Hub<small>ADMIN PANEL</small></div><button id="logout" class="btn danger hidden">LOG OUT</button></div></header>
<main class="wrap">
<section id="login" class="panel login"><h1>Admin Login</h1><p class="sub">Manage existing BMH concerts.</p>
<form id="loginForm"><label>Email</label><input id="email" type="email" required placeholder="admin@example.com">
<label>Password</label><input id="password" type="password" required>
<button class="btn gold" style="width:100%;margin-top:18px">LOGIN</button></form>
<div id="loginMsg" class="msg hidden"></div><p class="small">A Supabase Auth user must already exist for this login.</p></section>

<section id="dash" class="hidden"><h1>Concert Management</h1><p class="sub">Edit existing concerts and upload posters to Supabase Storage.</p><div id="msg" class="msg hidden"></div>
<div id="list" class="panel"><div class="toolbar"><input id="search" placeholder="Search concerts..."><button id="refresh" class="btn">↻ Refresh</button></div><div id="cards" class="cards"></div></div>

<div id="add" class="panel">
  <h2>Add New Concert</h2>
  <p class="sub">Publish a new concert to the public BMH website.</p>
  <form id="addForm">
    <div class="row">
      <div><label>Concert Title</label><input id="add_title" required placeholder="Concert name"></div>
      <div><label>Status</label><select id="add_status"><option>UPCOMING</option><option>LIVE</option><option>COMPLETED</option></select></div>
    </div>
    <div class="row">
      <div><label>Date</label><input id="add_date" type="date"></div>
      <div><label>Time</label><input id="add_time" placeholder="8:00 PM"></div>
    </div>
    <div class="row">
      <div><label>Venue</label><input id="add_venue"></div>
      <div><label>Location</label><input id="add_location"></div>
    </div>
    <label>Description</label><textarea id="add_description"></textarea>
    <label>Ticket Website URL</label><input id="add_ticket_url" type="url" placeholder="https://...">
    <label>Poster</label><input id="add_file" type="file" accept="image/*">
    <img id="add_preview" class="preview hidden">
    <div style="display:flex;gap:10px;margin-top:18px">
      <button id="add_save" class="btn gold">PUBLISH CONCERT</button>
      <button type="button" id="add_clear" class="btn">CLEAR</button>
    </div>
  </form>
</div>

<div id="edit" class="panel hidden"><h2>Edit Concert</h2>
<form id="form"><input id="id" type="hidden"><div class="row"><div><label>Concert Title</label><input id="title" required></div><div><label>Status</label><select id="status"><option>UPCOMING</option><option>LIVE</option><option>COMPLETED</option></select></div></div>
<div class="row"><div><label>Date</label><input id="date"></div><div><label>Time</label><input id="time"></div></div>
<div class="row"><div><label>Venue</label><input id="venue"></div><div><label>Location</label><input id="location"></div></div>
<label>Description</label><textarea id="description"></textarea><label>Ticket Website URL</label><input id="ticket_url" type="url" placeholder="https://...">
<label>Poster</label><input id="file" type="file" accept="image/*"><img id="preview" class="preview hidden">
<div style="display:flex;gap:10px;margin-top:18px"><button id="save" class="btn gold">SAVE CHANGES</button><button type="button" id="cancel" class="btn">CANCEL</button></div>
</form></div></section></main>

<script>
const SUPABASE_URL="https://ddlabynkdnaemvdfrmce.supabase.co";
const SUPABASE_KEY="sb_publishable_NUOua2PDUwhgWnfg1rUWTg_tMhEeLgk";
const BUCKET="concert-posters";
const TABLE="concert";
let token="",rows=[],current=null; const $=x=>document.getElementById(x);
function show(e,t,c=""){e.textContent=t;e.className="msg "+c;e.classList.remove("hidden")} function hide(e){e.classList.add("hidden")}
async function api(path,opt={}){const r=await fetch(SUPABASE_URL+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+(token||SUPABASE_KEY),"Content-Type":"application/json",...(opt.headers||{})}});const text=await r.text();let d;try{d=JSON.parse(text)}catch{}if(!r.ok)throw Error(d?.message||d?.error_description||d?.hint||text||"Request failed");return d}
async function login(){const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||"Login failed");token=d.access_token;localStorage.setItem("bmhToken",token)}
async function load(){rows=await api(`/rest/v1/${TABLE}?select=*&order=Mid.desc`);draw()}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#039;"}[m]))}
function draw(){const q=$("search").value.toLowerCase();const a=rows.filter(x=>(x.title||"").toLowerCase().includes(q));$("cards").innerHTML=a.map(e=>`<article class="card"><div class="poster"><img src="${esc(e.image_url||"https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=900&q=80")}" alt=""><span class="badge">${esc(e.status||"UPCOMING")}</span></div><div class="body"><h3>${esc(e.title||"Untitled")}</h3><div class="meta">${esc(e.date||"Date TBA")} · ${esc(e.timee||"Time TBA")}<br>${esc(e.venue||"Venue TBA")} · ${esc(e.location||"")}</div><div class="actions"><button class="btn gold" onclick="editEvent('${String(e.Mid).replace(/'/g,"\'")}')">EDIT</button></div></div></article>`).join("")||'<p class="small">No concerts found.</p>'}
function editEvent(id){current=rows.find(x=>String(x.Mid)===String(id));if(!current)return;$("id").value=current.Mid;$("title").value=current.title||"";$("status").value=(current.status||"UPCOMING").toUpperCase();$("date").value=current.date||"";$("time").value=current.timee||"";$("venue").value=current.venue||"";$("location").value=current.location||"";$("description").value=current.description||"";$("ticket_url").value=current.ticket_url||"";$("file").value="";if(current.image_url){$("preview").src=current.image_url;$("preview").classList.remove("hidden")}else hide($("preview"));$("list").classList.add("hidden");$("edit").classList.remove("hidden");scrollTo(0,0)}
function cancel(){$("edit").classList.add("hidden");$("list").classList.remove("hidden");current=null}
async function upload(f,id){if(f.size>5*1024*1024)throw Error("Poster must be 5 MB or smaller.");const ext=(f.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";const path=`concert-${id}-${Date.now()}.${ext}`;const r=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+token,"Content-Type":f.type||"image/jpeg","x-upsert":"true"},body:f});const text=await r.text();if(!r.ok){let d;try{d=JSON.parse(text)}catch{}throw Error(d?.message||d?.error||text||"Upload failed")}return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`}
$("loginForm").onsubmit=async e=>{e.preventDefault();hide($("loginMsg"));try{await login();await load();$("login").classList.add("hidden");$("dash").classList.remove("hidden");$("logout").classList.remove("hidden")}catch(x){show($("loginMsg"),x.message,"err")}};
$("form").onsubmit=async e=>{e.preventDefault();$("save").disabled=true;try{let image_url=current.image_url||null;const f=$("file").files[0];if(f)image_url=await upload(f,current.Mid);await api(`/rest/v1/${TABLE}?Mid=eq.${encodeURIComponent(current.Mid)}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({title:$("title").value.trim(),image_url,date:$("date").value.trim()||null,timee:$("time").value.trim()||null,venue:$("venue").value.trim()||null,location:$("location").value.trim()||null,description:$("description").value.trim()||null,ticket_url:$("ticket_url").value.trim()||null,status:$("status").value})});show($("msg"),"Concert updated successfully.","ok");cancel();await load();scrollTo(0,0)}catch(x){show($("msg"),x.message,"err")}finally{$("save").disabled=false}};
$("file").onchange=e=>{const f=e.target.files[0];if(f){$("preview").src=window.URL.createObjectURL(f);$("preview").classList.remove("hidden")}};
async function addConcert(){
  const f=$("add_file").files[0];
  if(f && f.size>5*1024*1024) throw Error("Poster must be 5 MB or smaller.");

  // Create the row first so Supabase generates Mid.
  const created=await api(`/rest/v1/${TABLE}`,{
    method:"POST",
    headers:{Prefer:"return=representation"},
    body:JSON.stringify({
      title:$("add_title").value.trim(),
      image_url:null,
      fate:null,
      date:$("add_date").value||null,
      timee:$("add_time").value.trim()||null,
      venue:$("add_venue").value.trim()||null,
      location:$("add_location").value.trim()||null,
      description:$("add_description").value.trim()||null,
      ticket_url:$("add_ticket_url").value.trim()||null,
      status:$("add_status").value
    })
  });

  const row=Array.isArray(created)?created[0]:created;
  if(!row || !row.Mid) throw Error("Concert was created but its ID was not returned.");

  if(f){
    const image_url=await upload(f,row.Mid);
    await api(`/rest/v1/${TABLE}?Mid=eq.${encodeURIComponent(row.Mid)}`,{
      method:"PATCH",
      headers:{Prefer:"return=minimal"},
      body:JSON.stringify({image_url})
    });
  }

  $("addForm").reset();
  hide($("add_preview"));
  show($("msg"),"New concert published successfully.","ok");
  await load();
  scrollTo(0,0);
}

$("addForm").onsubmit=async e=>{
  e.preventDefault();
  $("add_save").disabled=true;
  hide($("msg"));
  try{
    await addConcert();
  }catch(x){
    show($("msg"),x.message,"err");
  }finally{
    $("add_save").disabled=false;
  }
};

$("add_file").onchange=e=>{
  const f=e.target.files[0];
  if(f){
    $("add_preview").src=window.URL.createObjectURL(f);
    $("add_preview").classList.remove("hidden");
  }
};

$("add_clear").onclick=()=>{
  $("addForm").reset();
  hide($("add_preview"));
};

$("search").oninput=draw;$("refresh").onclick=load;$("cancel").onclick=cancel;$("logout").onclick=()=>{localStorage.removeItem("bmhToken");token="";location.reload()};
(async()=>{const t=localStorage.getItem("bmhToken");if(t){token=t;try{await load();$("login").classList.add("hidden");$("dash").classList.remove("hidden");$("logout").classList.remove("hidden")}catch{localStorage.removeItem("bmhToken");token=""}}})();
</script></body></html>
