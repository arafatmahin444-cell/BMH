<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMH Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080706;color:#f5f1eb;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #302922;background:#100d0b}.head{max-width:1000px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{font-size:34px;font-weight:900;color:#f5a623}.name{font-size:22px;font-weight:800}.tag{font-size:11px;color:#918a82;letter-spacing:2px}
main{max-width:1000px;margin:45px auto;padding:15px}.card{background:#14110f;border:1px solid #372f29;border-radius:22px;padding:28px;margin-bottom:20px;box-shadow:0 15px 50px #0008}
h1{margin:0 0 8px;font-size:38px}h2{margin:0 0 8px}.muted{color:#aaa39b;line-height:1.5}
label{display:block;font-weight:700;margin:17px 0 7px}input,textarea,select{width:100%;padding:14px;border-radius:12px;border:1px solid #40372f;background:#0c0b0a;color:#fff;font-size:16px}
textarea{min-height:110px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}
button{border:0;border-radius:12px;padding:14px 18px;font-weight:900;cursor:pointer;background:#f5a623;color:#15100b}
.secondary{background:#25211e;color:#fff;border:1px solid #443a32}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.msg{display:none;padding:13px;border-radius:11px;margin-top:15px}.err{display:block;background:#211111;border:1px solid #693939;color:#ffb2b2}.ok{display:block;background:#102015;border:1px solid #315b3d;color:#a9e5b8}
.event{border:1px solid #332c27;border-radius:15px;padding:17px;margin-top:12px;background:#0e0c0b}.event h3{margin:0 0 7px}.small{color:#999;font-size:13px}
.hidden{display:none!important}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}main{margin:25px auto}.card{padding:22px}h1{font-size:32px}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">BMH</div><div><div class="name">Band Music Hub</div><div class="tag">ADMIN PANEL</div></div></div></header>

<main>
<section id="login" class="card">
<h1>Admin Login</h1>
<p class="muted">Enter your BMH admin username and password.</p>
<label>Admin Username</label>
<input id="username" autocomplete="username" placeholder="BMH Admin">
<label>Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
<button id="loginBtn" style="width:100%;margin-top:20px">LOGIN</button>
<div id="loginMsg" class="msg"></div>
</section>

<section id="panel" class="hidden">
<div id="globalMsg" class="msg"></div>

<div class="card">
<h1>Concert Manager</h1>
<p class="muted">Publish new concerts and manage your existing BMH events.</p>
</div>

<div class="card">
<h2>➕ Add New Concert</h2>
<div class="grid">
<div><label>Concert Title *</label><input id="title"></div>
<div><label>Status</label><select id="status"><option>UPCOMING</option><option>LIVE</option><option>COMPLETED</option></select></div>
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Time</label><input id="timee" placeholder="8:00 PM"></div>
<div><label>Venue</label><input id="venue"></div>
<div><label>Location</label><input id="location"></div>
<div class="full"><label>Poster Image URL</label><input id="image_url" type="url" placeholder="https://..."></div>
<div class="full"><label>Ticket Website URL</label><input id="ticket_url" type="url" placeholder="https://..."></div>
<div class="full"><label>Description</label><textarea id="description"></textarea></div>
</div>
<button id="publish" style="margin-top:20px">PUBLISH CONCERT</button>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
<div><h2>Existing Concerts</h2><p class="muted">Currently published events.</p></div>
<button id="refresh" class="secondary">REFRESH</button>
</div>
<div id="events"></div>
</div>

<button id="logout" class="secondary" style="width:100%">LOGOUT</button>
</section>
</main>

<script>
const SUPABASE_URL="https://nbyuglzkyhwkvqgtwhmm.supabase.co";
const SUPABASE_KEY="sb_publishable_zi8cKWC-0qIGVVcU3r6hyw_mL0cecoc";
const AUTH_EMAIL="arafatmahin510@gmail.com"; // Internal Supabase Auth identity; never shown on login screen.
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
function message(el,text,ok=false){el.textContent=text;el.className="msg "+(ok?"ok":"err");}

$("loginBtn").onclick=async()=>{
 const username=$("username").value.trim();
 const password=$("password").value;
 if(username.toLowerCase()!=="bmh admin") return message($("loginMsg"),"Invalid admin username.");
 if(!password) return message($("loginMsg"),"Enter your password.");
 $("loginBtn").disabled=true;$("loginBtn").textContent="LOGGING IN...";
 const {error}=await db.auth.signInWithPassword({email:AUTH_EMAIL,password});
 $("loginBtn").disabled=false;$("loginBtn").textContent="LOGIN";
 if(error)return message($("loginMsg"),error.message);
 $("loginMsg").style.display="none";showPanel();
};

async function showPanel(){
 $("login").classList.add("hidden");$("panel").classList.remove("hidden");await loadEvents();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

async function loadEvents(){
 $("events").innerHTML="<p class='small'>Loading...</p>";
 const {data,error}=await db.from("concert").select("*").order("Mid",{ascending:false});
 if(error){message($("globalMsg"),error.message);return}
 $("events").innerHTML=data.length?data.map(c=>`
 <div class="event">
 <h3>${esc(c.title||"Untitled")}</h3>
 <div class="small">${esc(c.date||"Date TBA")} • ${esc(c.timee||"Time TBA")}</div>
 <div class="small">${esc(c.venue||"Venue TBA")} • ${esc(c.location||"")}</div>
 <div class="small">Status: ${esc(c.status||"UPCOMING")}</div>
 </div>`).join(""):"<p class='small'>No concerts found.</p>";
}

$("publish").onclick=async()=>{
 const title=$("title").value.trim();
 if(!title)return message($("globalMsg"),"Concert title is required.");
 $("publish").disabled=true;$("publish").textContent="PUBLISHING...";
 const {error}=await db.from("concert").insert({
 title,
 image_url:$("image_url").value.trim()||null,
 fate:null,
 date:$("date").value||null,
 timee:$("timee").value.trim()||null,
 venue:$("venue").value.trim()||null,
 location:$("location").value.trim()||null,
 description:$("description").value.trim()||null,
 ticket_url:$("ticket_url").value.trim()||null,
 status:$("status").value
 });
 $("publish").disabled=false;$("publish").textContent="PUBLISH CONCERT";
 if(error)return message($("globalMsg"),error.message);
 message($("globalMsg"),"New concert published successfully.",true);
 ["title","image_url","date","timee","venue","location","ticket_url","description"].forEach(id=>$(id).value="");
 await loadEvents();
};

$("refresh").onclick=loadEvents;
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};

(async()=>{
 const {data}=await db.auth.getSession();
 if(data.session)showPanel();
})();
</script>
</body>
</html>
